<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur - Café de la Culture</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-stone-900 p-4 sm:p-8 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <div class="bg-white border-4 border-black rounded-2xl p-6 shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black">📝 ÉDITEUR DE QUESTIONS</h1>
        <p class="text-xs font-bold text-gray-600">Création & Exportation</p>
      </div>
      <a href="/admin" class="bg-black text-white font-bold px-4 py-2 rounded-xl text-xs border-2 border-black">Accès Régie 🎙️</a>
    </div>

    <div class="bg-amber-100 border-2 border-black rounded-2xl p-4 space-y-3">
      <h2 class="text-sm font-black text-amber-900">💾 Exporter sous format .js</h2>
      <div class="flex flex-wrap gap-2">
        <button onclick="telechargerFichierJS(1)" class="bg-white border-2 border-black font-extrabold px-3 py-1.5 rounded-xl text-xs">📥 question1.js</button>
        <button onclick="telechargerFichierJS(2)" class="bg-white border-2 border-black font-extrabold px-3 py-1.5 rounded-xl text-xs">📥 question2.js</button>
        <button onclick="telechargerFichierJS(3)" class="bg-white border-2 border-black font-extrabold px-3 py-1.5 rounded-xl text-xs">📥 question3.js</button>
        <button onclick="telechargerFichierJS(4)" class="bg-white border-2 border-black font-extrabold px-3 py-1.5 rounded-xl text-xs">📥 question4.js</button>
        <button onclick="telechargerFichierJS(5)" class="bg-white border-2 border-black font-extrabold px-3 py-1.5 rounded-xl text-xs">📥 question5.js</button>
      </div>
    </div>

    <div class="bg-white border-2 border-black rounded-2xl p-6 space-y-4">
      <h2 id="formTitle" class="text-base font-black border-b-2 border-black pb-2">Ajouter une Question</h2>
      <input type="hidden" id="questionId">
      <input type="text" id="questionInput" placeholder="Intitulé de la question" class="w-full p-2.5 border-2 border-black rounded-xl font-bold text-sm">
      
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="opt0Input" placeholder="Option A" class="p-2 border-2 border-black rounded-lg text-xs font-semibold">
        <input type="text" id="opt1Input" placeholder="Option B" class="p-2 border-2 border-black rounded-lg text-xs font-semibold">
        <input type="text" id="opt2Input" placeholder="Option C" class="p-2 border-2 border-black rounded-lg text-xs font-semibold">
        <input type="text" id="opt3Input" placeholder="Option D" class="p-2 border-2 border-black rounded-lg text-xs font-semibold">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <select id="correctSelect" class="p-2 border-2 border-black rounded-lg text-xs font-bold bg-white">
          <option value="0">Bonne réponse : A</option>
          <option value="1">Bonne réponse : B</option>
          <option value="2">Bonne réponse : C</option>
          <option value="3">Bonne réponse : D</option>
        </select>
        <input type="number" id="timeInput" value="15" placeholder="Temps (sec)" class="p-2 border-2 border-black rounded-lg text-xs font-bold">
      </div>

      <button onclick="enregistrerQuestion()" class="w-full bg-emerald-400 font-black py-3 rounded-xl border-2 border-black">💾 Enregistrer</button>
    </div>

    <div class="bg-white border-2 border-black rounded-2xl p-6 space-y-3">
      <h2 class="text-base font-black">Questions en mémoire (<span id="totalCount">0</span>)</h2>
      <div id="questionsList" class="space-y-2"></div>
    </div>

  </div>

  <script>
    let questionsCache = [];

    async function chargerQuestions() {
      const res = await fetch('/api/questions');
      questionsCache = await res.json();
      document.getElementById('totalCount').innerText = questionsCache.length;
      const container = document.getElementById('questionsList');
      container.innerHTML = '';

      questionsCache.forEach((q, idx) => {
        container.innerHTML += `
          <div class="bg-gray-50 border-2 border-black p-3 rounded-xl flex justify-between items-center text-xs">
            <div>
              <p class="font-bold">Q${idx + 1}:${q.question}</p>
              <p class="text-emerald-700 font-bold">Réponse : Option ${String.fromCharCode(65 + parseInt(q.reponseCorrecte))}</p>
            </div>
            <button onclick="supprimerQuestion(${q.id})" class="bg-rose-500 text-white font-bold px-2 py-1 rounded border border-black">🗑️</button>
          </div>
        `;
      });
    }

    async function enregistrerQuestion() {
      const question = document.getElementById('questionInput').value.trim();
      const opt0 = document.getElementById('opt0Input').value.trim();
      const opt1 = document.getElementById('opt1Input').value.trim();
      const opt2 = document.getElementById('opt2Input').value.trim();
      const opt3 = document.getElementById('opt3Input').value.trim();
      const reponseCorrecte = parseInt(document.getElementById('correctSelect').value);
      const tempsLimiteSec = parseInt(document.getElementById('timeInput').value) || 15;

      if (!question || !opt0 || !opt1 || !opt2 || !opt3) return alert("Remplissez tous les champs !");

      await fetch('/api/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, propositions: [opt0, opt1, opt2, opt3], reponseCorrecte, tempsLimiteSec })
      });

      document.getElementById('questionInput').value = '';
      document.getElementById('opt0Input').value = '';
      document.getElementById('opt1Input').value = '';
      document.getElementById('opt2Input').value = '';
      document.getElementById('opt3Input').value = '';
      chargerQuestions();
    }

    function telechargerFichierJS(num) {
      if (questionsCache.length === 0) return alert("Aucune question à exporter !");
      const contenuJS = `const question${num} = ${JSON.stringify(questionsCache, null, 2)};\nif (typeof module !== 'undefined') module.exports = question${num};`;
      const blob = new Blob([contenuJS], { type: 'text/javascript' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `question${num}.js`;
      link.click();
    }

    async function supprimerQuestion(id) {
      await fetch(`/api/questions/${id}`, { method: 'DELETE' });
      chargerQuestions();
    }

    chargerQuestions();
  </script>
</body>
</html>
