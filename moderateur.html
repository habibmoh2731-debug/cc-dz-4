<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Régie Modérateur - Café de la Culture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 text-stone-900 p-4 sm:p-6 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <div class="bg-white border-4 border-black rounded-2xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-lg">
      <div>
        <h1 class="text-3xl font-black">🎙️ REGIE DIRECT</h1>
        <p class="text-sm font-bold text-gray-600">Café de la Culture</p>
      </div>
      <div class="bg-yellow-300 border-2 border-black p-3 rounded-xl text-center min-w-[150px]">
        <span class="text-xs font-bold block">CODE PIN SALON</span>
        <span id="pinDisplay" class="text-3xl font-black tracking-widest text-black">----</span>
      </div>
    </div>

    <div class="bg-amber-100 border-2 border-black rounded-2xl p-4 shadow-md space-y-2">
      <h2 class="text-sm font-black text-amber-900 uppercase">📁 Charger un pack (.json / .js)</h2>
      <div class="flex flex-col sm:flex-row gap-3 items-center">
        <input type="file" id="fileInput" accept=".json,.js" class="block w-full text-xs font-bold bg-white p-2 border-2 border-black rounded-xl cursor-pointer">
        <button onclick="chargerFichierQuestions()" class="w-full sm:w-auto bg-black text-white font-extrabold px-4 py-2 rounded-xl border-2 border-black hover:bg-gray-800 transition whitespace-nowrap">
          Charger 🚀
        </button>
      </div>
    </div>

    <div class="bg-white border-2 border-black rounded-2xl p-6 shadow-md space-y-4">
      <div class="flex justify-between items-center border-b-2 border-black pb-2">
        <span id="questionNum" class="text-xs font-black uppercase bg-black text-white px-3 py-1 rounded-md">Question -- / --</span>
        <span id="timerDisplay" class="text-lg font-black text-rose-600">⏱️ --s</span>
      </div>

      <h2 id="questionText" class="text-xl font-bold text-black text-center py-2">
        Chargez un fichier de questions ou cliquez sur Question Suivante
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="optionsGrid">
        <div id="modOpt0" class="border-2 border-black p-3 rounded-xl font-bold text-sm bg-gray-50">A. ---</div>
        <div id="modOpt1" class="border-2 border-black p-3 rounded-xl font-bold text-sm bg-gray-50">B. ---</div>
        <div id="modOpt2" class="border-2 border-black p-3 rounded-xl font-bold text-sm bg-gray-50">C. ---</div>
        <div id="modOpt3" class="border-2 border-black p-3 rounded-xl font-bold text-sm bg-gray-50">D. ---</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <button onclick="questionSuivante()" class="bg-black text-white font-black py-4 rounded-2xl border-2 border-black hover:bg-gray-800 transition active:scale-95 text-lg shadow-md">
        ▶️ Question Suivante
      </button>
      <button onclick="recommencer()" class="bg-rose-600 text-white font-black py-4 rounded-2xl border-2 border-black hover:bg-rose-700 transition active:scale-95 text-lg shadow-md">
        🔄 Recommencer
      </button>
    </div>

    <div class="bg-white border-2 border-black rounded-2xl p-4 shadow-md">
      <h2 class="font-black text-lg mb-2">Joueurs Connectés (<span id="countJoueurs">0</span>)</h2>
      <ul id="joueursList" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></ul>
    </div>

  </div>

  <script>
    const socket = io();

    socket.on('initAdmin', (data) => document.getElementById('pinDisplay').innerText = data.roomCode);
    socket.on('codeUpdated', (newCode) => document.getElementById('pinDisplay').innerText = newCode);

    socket.on('nouvelleQuestion', (q) => {
      document.getElementById('questionNum').innerText = `Question ${q.id} /${q.totalQuestions}`;
      document.getElementById('questionText').innerText = q.question;
      document.getElementById('timerDisplay').innerText = `⏱️ ${q.tempsLimiteSec}s`;

      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`modOpt${i}`);
        el.innerText = `${String.fromCharCode(65 + i)}.${q.propositions[i] || '---'}`;
        el.className = "border-2 border-black p-3 rounded-xl font-bold text-sm bg-gray-50";
      }
    });

    socket.on('tickTimer', (sec) => document.getElementById('timerDisplay').innerText = `⏱️ ${sec}s`);

    socket.on('revelerReponse', (data) => {
      const el = document.getElementById(`modOpt${data.reponseCorrecte}`);
      if (el) el.className = "border-2 border-black p-3 rounded-xl font-black text-sm bg-emerald-400 text-black shadow-md";
    });

    socket.on('updateJoueursList', (joueurs) => {
      document.getElementById('countJoueurs').innerText = joueurs.length;
      const list = document.getElementById('joueursList');
      list.innerHTML = '';
      joueurs.forEach(j => {
        list.innerHTML += `
          <li class="bg-gray-100 border-2 border-black p-2 rounded-xl flex justify-between items-center">
            <span class="font-bold text-sm">${j.pseudo}</span>
            <span class="font-black text-xs bg-yellow-300 border border-black px-2 py-0.5 rounded-lg">${j.score} pts</span>
          </li>
        `;
      });
    });

    function chargerFichierQuestions() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("Sélectionnez un fichier !");
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let questions = [];
          const content = e.target.result;
          if (file.name.endsWith('.json')) questions = JSON.parse(content);
          else if (file.name.endsWith('.js')) {
            const jsonText = content.substring(content.indexOf('['), content.lastIndexOf(']') + 1);
            questions = JSON.parse(jsonText);
          }
          socket.emit('loadQuestionsPack', questions);
          alert(`Pack chargé (${questions.length} questions) !`);
        } catch (err) { alert("Format de fichier invalide."); }
      };
      reader.readAsText(file);
    }

    function questionSuivante() { socket.emit('nextQuestion'); }
    function recommencer() { socket.emit('restartQuiz'); }
  </script>
</body>
</html>
