<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café de la Culture - Joueur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-amber-50 text-stone-900 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md space-y-4">
    
    <!-- Connexion -->
    <div id="joinScreen" class="bg-white border-4 border-black p-6 rounded-3xl shadow-xl space-y-4 text-center">
      <h1 class="text-3xl font-black">☕ CAFE GAME</h1>
      <p class="text-xs font-bold text-gray-500 uppercase">Rejoindre la session</p>
      <input type="text" id="pinInput" placeholder="Code PIN (4 chiffres)" class="w-full p-3 border-2 border-black rounded-xl text-center text-xl font-black uppercase outline-none focus:bg-amber-100">
      <input type="text" id="pseudoInput" placeholder="Votre Pseudo" class="w-full p-3 border-2 border-black rounded-xl text-center text-lg font-bold outline-none focus:bg-amber-100">
      <button onclick="rejoindre()" class="w-full bg-black text-white font-black py-4 rounded-xl text-lg border-2 border-black hover:bg-gray-800 transition active:scale-95">
        REJOINDRE LA PARTIE 🚀
      </button>
    </div>

    <!-- Attente -->
    <div id="waitScreen" class="hidden bg-white border-4 border-black p-8 rounded-3xl shadow-xl text-center space-y-3">
      <h2 class="text-2xl font-black">Prêt <span id="playerName" class="text-amber-600"></span> ! 🎮</h2>
      <p class="text-sm font-bold text-gray-600 animate-pulse">En attente du lancement par le modérateur...</p>
    </div>

    <!-- Écran de jeu -->
    <div id="gameScreen" class="hidden bg-white border-4 border-black p-6 rounded-3xl shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b-2 border-black pb-2">
        <span id="qIndex" class="text-xs font-black bg-black text-white px-2 py-1 rounded">Q--</span>
        <span id="qTimer" class="text-lg font-black text-rose-600">⏱️ --s</span>
      </div>

      <h2 id="qText" class="text-lg font-bold text-center">Chargement...</h2>

      <div class="grid grid-cols-1 gap-3 pt-2">
        <button onclick="repondre(0)" id="btn0" class="btn-opt bg-blue-100 border-2 border-black p-3 rounded-xl font-bold text-left active:scale-95">A. ---</button>
        <button onclick="repondre(1)" id="btn1" class="btn-opt bg-emerald-100 border-2 border-black p-3 rounded-xl font-bold text-left active:scale-95">B. ---</button>
        <button onclick="repondre(2)" id="btn2" class="btn-opt bg-amber-100 border-2 border-black p-3 rounded-xl font-bold text-left active:scale-95">C. ---</button>
        <button onclick="repondre(3)" id="btn3" class="btn-opt bg-rose-100 border-2 border-black p-3 rounded-xl font-bold text-left active:scale-95">D. ---</button>
      </div>
      <p id="feedback" class="text-center font-black text-sm text-amber-700 hidden">Réponse enregistrée ! ⏳</p>
    </div>

  </div>

  <script>
    const socket = io();

    function rejoindre() {
      const code = document.getElementById('pinInput').value.trim();
      const pseudo = document.getElementById('pseudoInput').value.trim();
      if (!code || !pseudo) return alert('Veuillez remplir le code et le pseudo !');
      socket.emit('joinGame', { pseudo, code });
    }

    socket.on('joinSuccess', (data) => {
      document.getElementById('playerName').innerText = data.pseudo;
      document.getElementById('joinScreen').classList.add('hidden');
      document.getElementById('waitScreen').classList.remove('hidden');
    });

    socket.on('joinError', (msg) => alert(msg));

    socket.on('nouvelleQuestion', (q) => {
      document.getElementById('waitScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('feedback').classList.add('hidden');

      document.getElementById('qIndex').innerText = `Q${q.id}/${q.totalQuestions}`;
      document.getElementById('qText').innerText = q.question;
      document.getElementById('qTimer').innerText = `⏱️ ${q.tempsLimiteSec}s`;

      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`btn${i}`);
        btn.innerText = `${String.fromCharCode(65 + i)}.${q.propositions[i] || '---'}`;
        btn.disabled = false;
        btn.className = "btn-opt bg-gray-50 border-2 border-black p-3 rounded-xl font-bold text-left active:scale-95";
      }
    });

    socket.on('tickTimer', (sec) => {
      document.getElementById('qTimer').innerText = `⏱️ ${sec}s`;
    });

    function repondre(idx) {
      socket.emit('submitAnswer', idx);
      document.getElementById('feedback').classList.remove('hidden');
      for (let i = 0; i < 4; i++) {
        document.getElementById(`btn${i}`).disabled = true;
      }
    }

    socket.on('revelerReponse', (data) => {
      const btnCorrect = document.getElementById(`btn${data.reponseCorrecte}`);
      if (btnCorrect) btnCorrect.className = "btn-opt bg-emerald-400 border-2 border-black p-3 rounded-xl font-black text-left";
    });

    socket.on('partieReinitialisee', () => location.reload());
  </script>
</body>
</html>
